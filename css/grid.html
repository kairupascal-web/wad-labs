<!doctype html>
<html>
    <head>
        <title>Grid Demo</title>
        <meta name="viewport" content="width=device-width",initial-scale =1.0;>
        <style>
            body{
                margin:0;
                /*view point height(absolute or relative )*/
                height:100vh;
                font-size:24px;
                
            }
            .container{
                display:grid;
                grid-template-columns:0.2fr 10fr 0.2fr;
                grid-template-rows:80px 1fr 40px;
                grid-template-areas:
                "header header header"
                "l-aside main r-aside"
                "footer footer footer";
                gap:8px;
                padding:8px;

            }
            header{
                grid-area:header;
                background:pink;
            }
            #left-aside{
                grid-area:l-aside;
                background:green;

            }
            main{
                grid-area:mainn;
                background:blue;
                height:79vh;
            }
            #right-aside{
                grid-area:r-aside;
                background:purple;
            }
            footer{
                grid-area:footer;
                background:brown;
            }

        </style>
    </head>
    <body>
    <!--grid container-->
    <div class="container">
        <header>header</header>
        <aside id ="left">left-aside</aside>
        <main>Main</main>
        <aside id="right">right-aside</aside>
        <footer></footer>

    </div>
    </body>


</html>
