<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>JUJU CAR WASH</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <section id="banner">
            <h1 id="mainHeading">JUJU CARWASH</h1>
            <p>Click the banner image to reveal more information.</p>
            <img id="ownerImage" src="css/images/banner.jpg" alt="JUJU CARWASH banner">
            <p id="ownerInfo">JUJU CARWASH offers premium cleaning, detailing, and accessories with fast and affordable service.</p>
        </section>

        <section id="features">
            <h3 id="services">SERVICES AND CAR ACCESSORIES</h3>
            <div id="car-accessories">
                <div id="servicesContainer" class="services-grid"></div>
                <div class="form-group">
                    <label for="serviceSelect">Service:</label>
                    <select id="serviceSelect" name="service">
                        <option value="">Select a service</option>
                    </select>
                </div>
                <div class="form-group actions-row">
                    <button type="button" id="removeSelectedBtn">Remove Selected Service</button>
                </div>
                <div class="form-group add-service-form">
                    <label for="newServiceName">Service Name:</label>
                    <input id="newServiceName" type="text" placeholder="e.g. Tire Shine">

                    <label for="newServiceDescription">Description:</label>
                    <input id="newServiceDescription" type="text" placeholder="e.g. Shine and protect tires.">

                    <label for="newServicePrice">Price:</label>
                    <input id="newServicePrice" type="text" placeholder="e.g. KSh 400">

                    <button type="button" id="addServiceBtn">Add Service</button>
                </div>
                <p id="serviceFeedback" class="service-feedback"></p>
            </div>
        </section>

        <section id="reviews">
            <h2>REVIEWS</h2>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label id="customerLabel">Customer:</label>
                <input type="radio" name="customer" value="0">car owner
                <input type="radio" name="customer" value="1">car wash attendant
                <input type="radio" name="customer" value="2">carpet owner
            </div>

            <div class="form-group">
                <label for="review">Review:</label>
                <textarea id="review" name="review"></textarea>
                <p id="inputFeedback" class="feedback-message"></p>
                <div id="counter">0 characters</div>
            </div>

            <button type="button" id="reviewSubmitBtn">Submit</button>
            <button type="button" id="reviewDeleteBtn">Delete</button>
        </section>
    </main>

    <script src="js/script.js" type="text/javascript"></script>
</body>
</html>
