<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>JUJU CAR WASH</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <section id="features">
            <h3 id="services">SERVICES AND CAR ACCESSORIES</h3>
            <div id="car-accessories">
                <div id="servicesContainer" class="services-grid"></div>
                <div class="form-group">
                    <label for="serviceSelect">Service:</label>
                    <select id="serviceSelect" name="service">
                        <option value="">Select a service</option>
                    </select>
                </div>
                <div class="form-group actions-row">
                    <button type="button" id="removeSelectedBtn">Remove Selected Service</button>
                </div>
                <div class="form-group add-service-form">
                    <label for="newServiceName">Service Name:</label>
                    <input id="newServiceName" type="text" placeholder="e.g. Tire Shine">

                    <label for="newServiceDescription">Description:</label>
                    <input id="newServiceDescription" type="text" placeholder="e.g. Shine and protect tires.">

                    <label for="newServicePrice">Price:</label>
                    <input id="newServicePrice" type="text" placeholder="e.g. KSh 400">

                    <button type="button" id="addServiceBtn">Add Service</button>
                </div>
                <p id="serviceFeedback" class="service-feedback"></p>
            </div>
        </section>
    </main>

    <script src="js/script.js" type="text/javascript"></script>
</body>
</html>
